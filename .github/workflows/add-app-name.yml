name: Add analytics app name

on:
  push:
    paths:
      - '.github/workflows/add-app-name.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add app_name to PostHog events
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """      capture_pageview: true,\n      person_profiles: 'identified_only'\n    })"""
          new = """      capture_pageview: false,\n      person_profiles: 'identified_only'\n    })\n    posthog.register({ app_name: 'journumbering' })\n    posthog.capture('$pageview')"""
          if old not in s:
              raise SystemExit('Expected PostHog init block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit migration
        run: |
          rm .github/workflows/add-app-name.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-app-name.yml
          git commit -m "Tag analytics events with app name"
          git push
